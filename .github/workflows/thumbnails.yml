name: Blog Post-İşleme

on:
  push:
    branches: [main]
    paths:
      - 'blog/*.html'
      - 'posts.json'
  workflow_dispatch:

concurrency:
  group: blog-postprocess
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  postprocess:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bağımlılıkları kur
        run: npm install

      - name: Thumbnail üret (kapak=null olanlar)
        run: node yerel-araclar/thumbnail-uret.mjs

      - name: Blog grid senkronla (posts.json + blog.html)
        run: node yerel-araclar/blog-uret.mjs

      - name: feed.xml + sitemap.xml senkronla
        run: node yerel-araclar/feed-sitemap-uret.mjs

      - name: Değişiklik varsa commit + push
        run: |
          git config user.email "actions@irriga.com.tr"
          git config user.name "Irriga Ajan"
          git add media/thumbnails posts.json blog.html feed.xml sitemap.xml
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
            exit 0
          fi
          git commit -m "Thumbnail + grid/feed/sitemap otomatik senkron [skip ci]"
          git pull --rebase -X theirs origin main
          git config http.postBuffer 524288000
          git config http.lowSpeedLimit 0
          git config http.lowSpeedTime 999999
          push_ok=0
          for i in 1 2 3 4 5; do
            if git push origin main; then push_ok=1; break; fi
            echo "Push denemesi $i başarısız, 15sn bekleyip tekrar..."
            sleep 15
          done
          if [ "$push_ok" -ne 1 ]; then
            echo "Push 5 denemede başarısız oldu."
            exit 1
          fi
          curl -s -H "Title: Irriga Ajan" -H "Tags: seedling" \
            -d "Blog post-işleme tamamlandı: thumbnail + grid/feed/sitemap güncellendi." \
            https://ntfy.sh/irriga-ajan-2026

      - name: Hata bildirimi
        if: failure()
        run: |
          curl -s -H "Title: Irriga Ajan HATA" -H "Priority: high" -H "Tags: warning" \
            -d "Blog post-işleme başarısız: https://github.com/${{ github.repository }}/actions" \
            https://ntfy.sh/irriga-ajan-2026
