name: Deploy to irriga.com.tr

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: cPanel Git Deploy tetikle
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            --user "${{ secrets.CPANEL_USER }}:${{ secrets.CPANEL_PASS }}" \
            "https://${{ secrets.CPANEL_HOST }}:2083/execute/VersionControlDeployment/create?repository_root=%2Fhome%2Fu2838272%2Firriga-site"
