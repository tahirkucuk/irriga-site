name: Blog Auto-Publish

on:
  schedule:
    - cron: '0 7 * * 1'   # Pazartesi  — 10:00 Türkiye (yaz) / 09:00 (kış)
    - cron: '0 7 * * 3'   # Çarşamba
    - cron: '0 7 * * 5'   # Cuma
  workflow_dispatch:       # Manuel tetikleme için

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      article_generated: ${{ steps.generate.outputs.article_generated }}
      article_slug: ${{ steps.generate.outputs.article_slug }}
      article_url: ${{ steps.generate.outputs.article_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bağımlılıkları yükle
        run: pip install -r scripts/requirements.txt

      - name: Makale oluştur
        id: generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python scripts/main.py batch

      - name: Değişiklikleri commit et ve push yap
        if: steps.generate.outputs.article_generated == 'true'
        env:
          ARTICLE_SLUG: ${{ steps.generate.outputs.article_slug }}
        run: |
          git config user.name "Irriga Blog Bot"
          git config user.email "bot@irriga.com.tr"
          git add blog/ posts.json blog.html scripts/topics.json
          TITLE=$(cat scripts/.article_title.txt 2>/dev/null || echo "$ARTICLE_SLUG")
          git commit -m "Blog: $TITLE"
          git push

      - name: FTP Deploy
        if: steps.generate.outputs.article_generated == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.irrigatr.com
          username: ${{ secrets.CPANEL_USER }}
          password: ${{ secrets.CPANEL_PASS }}
          port: 21
          security: loose
          server-dir: /irriga.com.tr/
          exclude: |
            **/.git*
            **/.git*/**
            .cpanel.yml
            scripts/
            scripts/**

  notify-failure:
    runs-on: ubuntu-latest
    needs: publish
    if: failure()
    steps:
      - name: Hata bildirimi gönder (yedek)
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: tahirkucuk@gmail.com
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "❌ Irriga Blog Otomasyonu Başarısız — Müdahale Gerekiyor"
          to: tahirkucuk@gmail.com
          from: "Irriga Blog <tahirkucuk@gmail.com>"
          content_type: text/html
          body: |
            <h2>⚠️ Blog otomasyonu başarısız oldu!</h2>
            <p>Script başlayamadı veya infrastructure hatası oluştu.</p>
            <p><a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">Hata loglarını inceleyin →</a></p>
            <p><em>Not: Script çalışabildiyse kendi hata bildirimi zaten gönderilmiştir.</em></p>
